spring.application.name=notification-service


spring.datasource.url=jdbc:mysql://localhost:3306/blinkit_order_service
spring.datasource.username=root
spring.datasource.password=Shubham@2904

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.blinkit.notification.kafka

spring.kafka.consumer.properties.spring.json.value.default.type=com.blinkit.notification.kafka.OrderCreatedEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false

server.port=8081