spring.application.name=order-service

server.port=8086

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ownly_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shubham@2904}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inventory Service timeouts
spring.cloud.openfeign.client.config.inventory-service.connectTimeout=2000
spring.cloud.openfeign.client.config.inventory-service.readTimeout=3000

# Enable circuit breaker integration for Feign
spring.cloud.openfeign.circuitbreaker.enabled=true

# Configure the circuit breaker
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventoryService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=10s


