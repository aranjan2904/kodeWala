services:

  mysql:
    image: mysql:8.0
    container_name: ownly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Shubham@2904
      MYSQL_DATABASE: ownly_db
    ports:
      - "3307:3306"

  ownly:
    build: .
    container_name: ownly
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ownly_db
      DB_USERNAME: root
      DB_PASSWORD: Shubham@2904
    depends_on:
      - mysql